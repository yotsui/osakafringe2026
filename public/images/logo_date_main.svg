<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="100%" height="100%" fill="none">
  <!-- Date top left -->
  <text x="8" y="24" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="1.5" fill="#e4007f">OCT8– NOV8,2026</text>
  
  <!-- Main Japanese Title -->
  <text x="8" y="74" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#e4007f">大阪文化万博</text>
  
  <!-- Divider Bar -->
  <rect x="256" y="38" width="3.5" height="42" rx="1.75" fill="#e4007f" />
  
  <!-- Right English Group: osaka / fringe -->
  <!-- osaka (small curved top) -->
  <text x="278" y="48" font-family="'Comfortaa', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#e4007f">osaka</text>
  <!-- fringe (bold lowercase) -->
  <text x="274" y="80" font-family="'Comfortaa', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#e4007f">fringe</text>
  
  <!-- Fringe dot spark accent -->
  <circle cx="317" cy="48" r="3" fill="#e4007f" />
</svg>